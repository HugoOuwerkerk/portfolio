name: Deploy

# Every push to main deploys self.hah-ouw.dev to the VPS: pull, rebuild the Docker image,
# restart. If the image build fails, the old container keeps running.
# Can also be started by hand from the Actions tab (workflow_dispatch).
#
# Repo secrets needed: VPS_HOST, VPS_USER, VPS_SSH_KEY, DEPLOY_PATH
# (DEPLOY_PATH = the folder on the VPS where this repo is cloned).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Pull and rebuild on the VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git pull --ff-only origin main
            docker compose up -d --build
            docker image prune -f
